<style>
    :root {
        --lightness: 50;
        --proColor: lab(calc(var(--lightness) - 1) 65 -65);
        --conColor: lab(calc(var(--lightness) + 0) 40 65);
        --neutralColor: lab(calc((var(--lightness) + 100) / 2) 0 0);
        --background-color: black;
        color: var(--neutralColor);
        --markerThickness: 5px;
    }

    .v1 {
        --scoreborder-width: 5px;
        --scoreboarder-radius: 50px;
        --padding: 10px;
    }

    .v2 {
        --scoreborder-width: 10px;
        --scoreboarder-radius: 50px;
        --padding: 10px;
    }

    .v3 {
        --scoreborder-width: 5px;
        --scoreboarder-radius: 0px;
        --padding: 10px;
    }

    .v4 {
        --scoreborder-width: 10px;
        --scoreboarder-radius: 0px;
        --padding: 10px;
    }

    body {
        background-color: black;
        font-family: "Courier New", Courier, monospace;
    }

    .scoreboardMain {
        margin: 20px;
        display: grid;
        overflow: hidden;
        grid-template-columns: auto min-content;
        grid-template-areas:
            "volumeScoreCell proScoreCell"
            "volumeScoreCell conScoreCell";
        grid-gap: var(--scoreborder-width);
        background-color: var(--neutralColor);
        border-radius: var(--scoreboarder-radius);
        border: var(--scoreborder-width) solid var(--neutralColor);
        width: 400px;
        height: 400px;

        >div {
            background-color: var(--background-color);
        }

        .volumeScoreCell {
            position: relative;
            grid-area: volumeScoreCell;
            overflow: hidden;
            display: grid;
            grid-template-areas: "pile";
            border-top-left-radius: calc(var(--scoreboarder-radius) - var(--scoreborder-width));
            border-bottom-left-radius: calc(var(--scoreboarder-radius) - var(--scoreborder-width));
            border: var(--padding) solid var(--background-color);
        }
    }

    .volumeScorePro {
        background-color: var(--proColor);
        border-bottom: var(--markerThickness) solid var(--background-color);
    }

    .volumeScoreCon {
        height: 100%;
        background-color: var(--conColor);
    }

    .volumeScoreCell>* {
        grid-area: pile;
    }

    .marker {
        background-color: black;
        position: absolute;
        height: var(--markerThickness);
        right: 0;
        width: 50%;
    }

    /* @keyframes growShrink {

        0%,
        100% {
            height: 1%;
        }

        50% {
            height: 97%;
        }
    }

    .volumeScorePro {
        animation: growShrink 5s;
    } */

    .numCell {
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        padding: var(--padding);
    }

    .proScoreCell {
        grid-area: proScoreCell;
        color: var(--proColor);
    }

    .conScoreCell {
        grid-area: conScoreCell;
        color: var(--conColor);
    }
</style>
